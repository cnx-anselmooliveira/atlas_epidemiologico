<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Ícones dos modelos de previsão: traço 24×24 (stroke 2, pontas arredondadas), como o sprite do
       design system. Uso: <svg class="ds-icon"><use href="/icons-modelos.svg#m-catboost"/></svg>
       Um símbolo por família de modelo. -->

  <!-- CatBoost · árvores com reforço (gradient boosting): uma árvore que se ramifica -->
  <symbol id="m-catboost" viewBox="0 0 24 24">
    <path d="M12 21v-7"/><path d="M12 14 7 9"/><path d="m12 14 5-5"/>
    <circle cx="12" cy="4.5" r="1.8"/><circle cx="7" cy="8" r="1.8"/><circle cx="17" cy="8" r="1.8"/>
    <path d="M12 6.3V14"/><path d="M5 21h14"/>
  </symbol>

  <!-- SVR · vetores de suporte: pontos e a faixa de margem em volta da reta -->
  <symbol id="m-svr" viewBox="0 0 24 24">
    <path d="M3 20 21 4"/><path d="M3 15 17 3" stroke-dasharray="2 3"/><path d="M7 21 21 9" stroke-dasharray="2 3"/>
    <circle cx="6.5" cy="9" r="1.4"/><circle cx="10" cy="5.5" r="1.4"/><circle cx="17.5" cy="17" r="1.4"/><circle cx="13.5" cy="19.5" r="1.4"/>
  </symbol>

  <!-- LSTM · rede recorrente: células ligadas, com a saída realimentada -->
  <symbol id="m-lstm" viewBox="0 0 24 24">
    <circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>
    <path d="M7 12h3"/><path d="M14 12h3"/>
    <path d="M12 10V6a4 4 0 0 1 4-1h2" /><path d="m17 3 2 2-2 2"/>
    <path d="M5 14v3h14v-3"/>
  </symbol>

  <!-- Bayesiano · distribuição posterior: curva em sino sobre a linha de base -->
  <symbol id="m-baseline_bayes" viewBox="0 0 24 24">
    <path d="M3 19h18"/><path d="M3 19c3 0 3.5-14 9-14s6 14 9 14"/><path d="M12 5v14" stroke-dasharray="2 3"/>
  </symbol>

  <!-- Chronos · modelo de fundação para séries temporais: relógio com a série ao fundo -->
  <symbol id="m-chronos" viewBox="0 0 24 24">
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/><path d="M3.5 16.5 6 14l2 1.5 2-3"/>
  </symbol>

  <!-- Ensemble · combinação (stacking): camadas empilhadas -->
  <symbol id="m-ensemble" viewBox="0 0 24 24">
    <path d="m12 3 9 4.5-9 4.5-9-4.5L12 3Z"/><path d="m3 12 9 4.5 9-4.5"/><path d="m3 16.5 9 4.5 9-4.5"/>
  </symbol>
</svg>
