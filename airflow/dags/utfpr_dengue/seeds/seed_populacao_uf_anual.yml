version: 2

seeds:
  - name: seed_populacao_uf_anual
    description: >
      População residente por UF e ano, de 2000 ao ano corrente, gerada por
      scripts/gerar_seed_populacao_uf_anual.py a partir da API SIDRA do IBGE:
      censos 2000/2010 (tabela 202) e 2022 (tabela 9514) e estimativas anuais
      (tabela 6579). Anos sem valor entre dois conhecidos são interpolados
      linearmente; anos depois do último valor repetem o último (extrapolado).
      Grão: UF × ano.
    config:
      column_types:
        uf: string
        year: int64
        population: int64
        origin: string
        source: string
    columns:
      - name: uf
        description: Sigla da UF.
        data_tests: [not_null]
      - name: year
        description: Ano de referência da população.
        data_tests: [not_null]
      - name: population
        description: População residente.
        data_tests: [not_null]
      - name: origin
        description: De onde veio o valor (censo, estimativa, interpolado, extrapolado).
        data_tests:
          - accepted_values:
              arguments:
                values: [censo, estimativa, interpolado, extrapolado]
      - name: source
        description: Fonte por extenso (tabela do SIDRA ou regra de preenchimento).
