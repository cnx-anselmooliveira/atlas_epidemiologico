version: 2

models:
  - name: gold_dengue_incidence_rate_country_weekly
    description: >
      Taxa de incidência semanal de dengue por país (casos por 100 mil
      habitantes), usando população reportada pelo PAHO/ARBO Portal — único
      source com dado de população disponível no projeto, e só em nível de
      país (não há fonte de população subnacional carregada, então este
      indicador não existe por UF/depto — ver comentário no SQL). Grão:
      país × ano epidemiológico × semana epidemiológica. Fontes:
      silver_dengue_weekly_cases, bronze_dengue_paho_americas.
    columns:
      - name: country_iso3
        description: Código ISO3 do país. NULL para países cobertos só pelo fallback PAHO. Identificador.
      - name: country_name
        description: Nome do país. Dimensão.
      - name: year
        description: Ano epidemiológico. Dimensão temporal.
      - name: epi_week
        description: Semana epidemiológica. Dimensão temporal.
      - name: epi_week_start_date
        description: Data aproximada de início da semana. Dimensão temporal.
      - name: total_cases
        description: Métrica. Casos na semana, somados de todas as unidades administrativas do país.
      - name: population_thousands
        description: População do país em milhares, conforme reportada pelo PAHO para o ano. Dimensão/atributo de referência.
      - name: incidence_per_100k
        description: "Métrica calculada. Regra: (total_cases / population_thousands) * 100 — equivalente a casos / população total * 100.000. NULL quando não há população reportada para o país/ano."
      - name: gold_generated_at
        description: "Timestamp de quando esta tabela foi (re)gerada pelo dbt. Regra: CURRENT_TIMESTAMP() — estável (mesmo valor) em todas as linhas da mesma execução. Coluna de auditoria/freshness, usada pelo job de exportação pra decidir se precisa baixar a tabela de novo."

semantic_models:
  - name: gold_dengue_incidence_rate_country_weekly
    description: Modelo semântico da taxa de incidência semanal de dengue por país.
    model: ref('gold_dengue_incidence_rate_country_weekly')
    defaults:
      agg_time_dimension: epi_week_start_date
    entities:
      - name: country
        type: foreign
        expr: country_iso3
    dimensions:
      - name: country_name
        type: categorical
      - name: year
        type: categorical
      - name: epi_week
        type: categorical
      - name: epi_week_start_date
        type: time
        type_params:
          time_granularity: week
    measures:
      - name: total_cases
        agg: sum
      - name: population_thousands
        agg: average
      - name: incidence_per_100k
        agg: average
