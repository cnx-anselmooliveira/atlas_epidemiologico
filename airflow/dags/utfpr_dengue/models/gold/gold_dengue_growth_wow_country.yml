version: 2

models:
  - name: gold_dengue_growth_wow_country
    description: >
      Crescimento semana a semana de casos por país, com média móvel de 4
      semanas — indicador temporal de aceleração/desaceleração de surtos.
      Grão: país × ano epidemiológico × semana epidemiológica. Fonte
      Silver: silver_dengue_weekly_cases.
    columns:
      - name: country_iso3
        description: Código ISO3 do país. Identificador.
      - name: country_name
        description: Nome do país. Dimensão.
      - name: year
        description: Ano epidemiológico. Dimensão temporal.
      - name: epi_week
        description: Semana epidemiológica. Dimensão temporal.
      - name: epi_week_start_date
        description: Data aproximada de início da semana. Dimensão temporal.
      - name: total_cases
        description: Métrica. Casos na semana.
      - name: previous_week_cases
        description: "Métrica auxiliar. Regra: LAG(total_cases) por país ordenado por ano/semana."
      - name: wow_growth_pct
        description: "Métrica calculada (indicador de crescimento). Regra: 100 * (total_cases - previous_week_cases) / previous_week_cases."
      - name: rolling_avg_cases_4w
        description: "Métrica calculada. Regra: média de total_cases das 4 semanas mais recentes (janela móvel), por país."
      - name: gold_generated_at
        description: "Timestamp de quando esta tabela foi (re)gerada pelo dbt. Regra: CURRENT_TIMESTAMP() — estável (mesmo valor) em todas as linhas da mesma execução. Coluna de auditoria/freshness, usada pelo job de exportação pra decidir se precisa baixar a tabela de novo."

semantic_models:
  - name: gold_dengue_growth_wow_country
    description: Modelo semântico do crescimento semana a semana de casos por país.
    model: ref('gold_dengue_growth_wow_country')
    defaults:
      agg_time_dimension: epi_week_start_date
    entities:
      - name: country
        type: foreign
        expr: country_iso3
    dimensions:
      - name: country_name
        type: categorical
      - name: year
        type: categorical
      - name: epi_week
        type: categorical
      - name: epi_week_start_date
        type: time
        type_params:
          time_granularity: week
    measures:
      - name: total_cases
        agg: sum
      - name: previous_week_cases
        agg: sum
      - name: wow_growth_pct
        agg: average
      - name: rolling_avg_cases_4w
        agg: average
