version: 2

models:
  - name: gold_dengue_top_admin1_ranking
    description: >
      Ranking de unidades administrativas (UF/departamento/província) por
      volume de casos, dentro de cada país e ano, com sinalização de
      hotspots recorrentes. Grão: país × ano epidemiológico × unidade
      administrativa nível 1. Exclui linhas PAHO (sem granularidade
      subnacional). Fonte Silver: silver_dengue_weekly_cases.
    columns:
      - name: country_iso3
        description: Código ISO3 do país. Identificador.
      - name: country_name
        description: Nome do país. Dimensão.
      - name: year
        description: Ano epidemiológico. Dimensão temporal.
      - name: admin1_name
        description: Nome da UF/departamento/província. Dimensão.
      - name: total_cases
        description: Métrica. Soma de casos no ano na unidade.
      - name: rank_in_country_year
        description: "Métrica calculada (ranking). Regra: DENSE_RANK() por total_cases desc, partição país×ano."
      - name: share_of_country_total_pct
        description: "Métrica calculada. Regra: 100 * total_cases / soma(total_cases) no país×ano."
      - name: is_recurrent_top5_hotspot
        description: "Indicador de recorrência. Regra: true quando a unidade está no top 5 do país no ano corrente E também estava no top 5 no ano anterior."
      - name: gold_generated_at
        description: "Timestamp de quando esta tabela foi (re)gerada pelo dbt. Regra: CURRENT_TIMESTAMP() — estável (mesmo valor) em todas as linhas da mesma execução. Coluna de auditoria/freshness, usada pelo job de exportação pra decidir se precisa baixar a tabela de novo."

semantic_models:
  - name: gold_dengue_top_admin1_ranking
    description: Modelo semântico do ranking de unidades administrativas por volume de casos.
    model: ref('gold_dengue_top_admin1_ranking')
    entities:
      - name: country
        type: foreign
        expr: country_iso3
    dimensions:
      - name: country_name
        type: categorical
      - name: year
        type: categorical
      - name: admin1_name
        type: categorical
    measures:
      - name: total_cases
        agg: sum
      - name: rank_in_country_year
        agg: min
      - name: share_of_country_total_pct
        agg: average
      - name: is_recurrent_top5_hotspot
        agg: sum_boolean
