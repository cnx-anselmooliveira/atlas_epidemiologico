[project]
name = "atlas-ml"
version = "0.1.0"
description = "Projeto de treino do Atlas da Dengue: experimentos rastreados no MLflow, leitura de features do BigQuery e promoção de modelos dev → hml → prod."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlflow-skinny>=3.1,<4",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic-settings>=2.4",
    "google-cloud-bigquery>=3.25",
    "db-dtypes>=1.3",
    "typer>=0.12",
    "skops>=0.10",
]

[project.optional-dependencies]
# Modelos de previsão (add-dengue-forecast-models). Fora da imagem `runtime` leve.
# nutpie: amostrador NUTS compilado com numba para o PyMC (dispensa compilador C).
models = [
    "catboost>=1.2",
    "torch>=2.5",
    "pymc>=5.20",
    "nutpie>=0.13",
    "h5netcdf>=1.3",  # idata.nc do baseline bayesiano
    "h5py>=3.11",
    "chronos-forecasting>=1.5",
    "matplotlib>=3.9",  # figuras das runs
    # execução do notebook do pipeline pelo Airflow (move-forecast-to-notebook-pipeline)
    "papermill>=2.6",
    "ipykernel>=6.29",
]

[project.scripts]
atlas-ml = "atlas_ml.cli:app"

# torch só do índice CPU do PyTorch (sem CUDA: ~2 GB a menos nas imagens)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "matplotlib>=3.9",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_ml"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.format]
# o código das células comuns vem de notebooks/_ferramentas/comum.py (sincronizar_comum.py): se o formatador
# reescrevesse as células, elas divergiriam da fonte a cada formatação. O lint dos notebooks continua valendo.
exclude = ["notebooks/**/*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# células de notebook têm imports no meio (depois de configurar as threads) e linhas de print longas;
# o código dos modelos mora nos notebooks e é lido na tela, não em um editor de largura fixa
"notebooks/**/*.ipynb" = ["E402", "E501"]
# ferramentas dos notebooks: a fonte das células comuns guarda código dentro de strings e as mensagens são longas
"notebooks/_ferramentas/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
markers = [
    "models: testes que exigem o grupo de dependências 'models' (CatBoost, PyTorch, PyMC, Chronos)",
]
