# Publica a imagem do site (frontend/): dev e hml por push (só com mudança em frontend/),
# X.Y por tag. Testes e builds vêm do ci.yml via _image.yml.
name: frontend

on:
  push:
    branches: [dev, hml]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/_image.yml"
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/_image.yml
    with:
      image: frontend
      context: frontend
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      PORTAINER_WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_FRONTEND }}
