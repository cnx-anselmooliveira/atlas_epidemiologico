# Publica a imagem do site (frontend/): dev e hml por push (só com mudança em frontend/), X.Y por tag, ou à mão (workflow_dispatch).
name: frontend

on:
  push:
    branches: [dev, hml]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
      - ".github/workflows/_image.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/_image.yml
    with:
      image: frontend
      context: frontend
      webhook_secret: PORTAINER_WEBHOOK_FRONTEND
    secrets: inherit
