# Workflow reutilizável: confere os secrets, testa, builda e publica UMA imagem no DockerHub e
# atualiza o serviço no Portainer. Chamado por frontend, backend, airflow, mlflow e ml.
#
# Tag pela origem: branch dev → "dev", hml → "hml", tag vX.Y (ou vX.Y.Z) → "X.Y". Nunca "latest".
# Tag de versão: só de commit que está em origin/main e que ainda não existe no DockerHub
# (versão imutável).
#
# Deploy: job separado, com o GitHub Environment da origem (hml → "hml", tag → "prod"; dev não
# implanta). O webhook é o secret informado em `webhook_secret` (PORTAINER_WEBHOOK_<IMAGEM>) do Environment, então um push em hml
# nunca chega ao stack de produção, e o Environment "prod" pode exigir aprovação.
# Os chamadores usam `secrets: inherit`: DOCKERHUB_* são secrets do repositório.
name: _image

on:
  workflow_call:
    inputs:
      image:
        description: Nome da imagem (anselmomendes/atlas-epidemiologia-<image>)
        required: true
        type: string
      context:
        required: true
        type: string
      file:
        description: Dockerfile (padrão <context>/Dockerfile)
        required: false
        type: string
        default: ""
      target:
        description: Alvo do Dockerfile (multi-stage); vazio usa o último estágio
        required: false
        type: string
        default: ""
      webhook_secret:
        description: "Nome do secret do Environment com o webhook do Portainer, como PORTAINER_WEBHOOK_BACKEND"
        required: true
        type: string
      build_args:
        description: Build args extras, um KEY=VALUE por linha
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  secrets-check:
    # Falha em segundos, antes dos testes e do build, dizendo o que falta e onde criar
    name: Secrets do DockerHub
    runs-on: ubuntu-latest
    steps:
      - name: Conferir DOCKERHUB_USERNAME e DOCKERHUB_TOKEN
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          faltam=()
          [ -n "${DOCKERHUB_USERNAME}" ] || faltam+=(DOCKERHUB_USERNAME)
          [ -n "${DOCKERHUB_TOKEN}" ] || faltam+=(DOCKERHUB_TOKEN)
          if [ "${#faltam[@]}" -gt 0 ]; then
            echo "::error::Faltam secrets do repositório: ${faltam[*]}. Crie em Settings › Secrets and variables › Actions (passo a passo em deploy/README.md)."
            exit 1
          fi
          echo "Secrets do DockerHub presentes."

  tests:
    # Nenhuma imagem é publicada se o pipeline de testes falhar (add-ci-test-pipeline)
    name: Testes (pipeline ci.yml)
    needs: secrets-check
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publicar ${{ inputs.image }}
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      REPO: anselmomendes/atlas-epidemiologia-${{ inputs.image }}
    steps:
      - name: Liberar espaço em disco (a imagem do Airflow passa de 10 GB nas camadas)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker image prune -af >/dev/null 2>&1 || true
          df -h / | tail -1
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag da imagem pela origem
        id: tag
        run: |
          case "${GITHUB_REF}" in
            refs/heads/dev) tag=dev ;;
            refs/heads/hml) tag=hml ;;
            refs/tags/v*)
              name="${GITHUB_REF_NAME}"
              if [[ ! "$name" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
                echo "::error::Tag fora do padrão vX.Y ou vX.Y.Z: ${name}"
                exit 1
              fi
              tag="${name#v}"
              echo "version=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Só dev, hml e tags vX.Y publicam imagens (origem: ${GITHUB_REF})"
              exit 1
              ;;
          esac
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Tag: ${tag}"
      - name: Versão só de commit que está em main
        if: steps.tag.outputs.version == 'true'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::A tag ${GITHUB_REF_NAME} aponta para ${GITHUB_SHA}, que não está em main."
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Versão ainda não publicada (imutável)
        if: steps.tag.outputs.version == 'true'
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if docker manifest inspect "${REPO}:${TAG}" >/dev/null 2>&1; then
            echo "::error::${REPO}:${TAG} já existe no DockerHub; versões não são sobrescritas."
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.context }}
          file: ${{ inputs.file != '' && inputs.file || format('{0}/Dockerfile', inputs.context) }}
          target: ${{ inputs.target }}
          push: true
          tags: ${{ env.REPO }}:${{ steps.tag.outputs.tag }}
          build-args: |
            ATLAS_GIT_SHA=${{ github.sha }}
            ATLAS_IMAGE_TAG=${{ steps.tag.outputs.tag }}
            ${{ inputs.build_args }}
          cache-from: type=gha,scope=${{ inputs.image }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image }}

  deploy:
    # dev não é implantado. hml usa o Environment "hml"; versão usa "prod" (pode exigir aprovação).
    name: Implantar ${{ inputs.image }}
    needs: publish
    if: needs.publish.outputs.tag != 'dev'
    runs-on: ubuntu-latest
    environment: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'hml' }}
    steps:
      - name: Atualiza o serviço no Portainer
        env:
          PORTAINER_WEBHOOK: ${{ secrets[inputs.webhook_secret] }}
          TAG: ${{ needs.publish.outputs.tag }}
          AMBIENTE: ${{ startsWith(github.ref, 'refs/tags/') && 'prod' || 'hml' }}
          IMAGEM: ${{ inputs.image }}
          SECRET_NAME: ${{ inputs.webhook_secret }}
        run: |
          if [ -z "${PORTAINER_WEBHOOK}" ]; then
            echo "::warning::Deploy não acionado: o Environment ${AMBIENTE} não tem o secret ${SECRET_NAME}. A imagem foi publicada (tag ${TAG}); atualize o serviço no Portainer à mão."
            exit 0
          fi
          # -f: resposta de erro derruba o job (falha visível)
          curl -fsS -X POST "${PORTAINER_WEBHOOK}?tag=${TAG}"
          echo "Portainer (${AMBIENTE}) acionado para ${IMAGEM}:${TAG}"
