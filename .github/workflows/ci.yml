# Pipeline de testes (spec ci-test-pipeline): portão das branches hml e main.
# Todos os jobs rodam sem segredos (PRs de fork funcionam igual). O check obrigatório
# na proteção das branches é o job agregado "ci-ok".
name: ci

on:
  push:
    branches: [hml, main]
  pull_request:
    branches: [hml, main]
  workflow_dispatch:
  workflow_call: # publicação de imagens e releases só seguem depois deste pipeline
    inputs:
      completo:
        # numa chamada o github.event_name é o do chamador (push): sem este input, uma publicação de
        # imagem poderia cair na via rápida. Só existe na chamada; em push e PR fica vazio.
        description: Força o pipeline completo (padrão nas chamadas pela publicação de imagens)
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.12"
  ACTIONLINT_VERSION: "1.7.7"
  OPENSPEC_VERSION: "2.0.0"
  GITLEAKS_VERSION: "8.21.2"

jobs:
  escopo:
    # Via rápida (add-forecast-model-dags): mudança só em DAGs (e seus testes), notebooks, docs ou
    # OpenSpec dispensa imagens, e2e, frontend, backend e testes do pacote ml. A decisão está em
    # platform/ci/escopo.sh (casos em test-escopo.sh). Chamada, disparo manual ou diff sem base
    # confiável: pipeline completo.
    name: escopo
    runs-on: ubuntu-latest
    outputs:
      rapido: ${{ steps.escopo.outputs.rapido }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: arquivos alterados → via rápida ou completa
        id: escopo
        env:
          EVENTO: ${{ github.event_name }}
          COMPLETO: ${{ inputs.completo }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          ANTES: ${{ github.event.before }}
          DEPOIS: ${{ github.sha }}
        run: |
          if [ "${COMPLETO}" = "true" ]; then
            echo "escopo: completo (chamado pela publicação de imagens)"
            echo "rapido=false" >> "$GITHUB_OUTPUT"
          elif [ "${EVENTO}" = "pull_request" ]; then
            git diff --name-only "${BASE}...${HEAD}" | tee /dev/stderr | bash platform/ci/escopo.sh >> "$GITHUB_OUTPUT"
          elif [ "${EVENTO}" = "push" ] && [ -n "${ANTES}" ] && [ "${ANTES}" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${ANTES}^{commit}" 2>/dev/null; then
            git diff --name-only "${ANTES}" "${DEPOIS}" | tee /dev/stderr | bash platform/ci/escopo.sh >> "$GITHUB_OUTPUT"
          else
            echo "escopo: completo (evento ${EVENTO} sem diff confiável)"
            echo "rapido=false" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      - name: ruff (pacote ml e DAGs)
        working-directory: ml
        run: |
          uv sync --frozen
          uv run ruff check . ../airflow/dags ../airflow/tests
          uv run ruff format --check . ../airflow/dags ../airflow/tests
      - name: notebooks versionados sem saídas (o repositório é público)
        run: python3 ml/notebooks/_ferramentas/verificar_sem_saidas.py
      - name: shellcheck
        run: shellcheck infra/mlflow/entrypoint.sh airflow/config/init.sh airflow/config/aguardar-clone.sh platform/postgres/init-databases.sh platform/ci/e2e.sh platform/ci/check-secrets.sh platform/ci/test-check-stack-jupyter.sh platform/ci/escopo.sh platform/ci/test-escopo.sh platform/ci/testar-dags.sh .githooks/pre-commit
      - name: casos da via rápida (escopo.sh)
        run: bash platform/ci/test-escopo.sh
      - name: actionlint
        run: |
          bash <(curl -fsSL "https://raw.githubusercontent.com/rhysd/actionlint/v${ACTIONLINT_VERSION}/scripts/download-actionlint.bash") "${ACTIONLINT_VERSION}"
          ./actionlint -color
      - name: docker compose config
        run: |
          printf 'POSTGRES_PASSWORD=ci\nAIRFLOW_ADMIN_PASSWORD=ci\n' > /tmp/ci.env
          export ATLAS_GIT_SHA="${GITHUB_SHA}"
          docker compose -f platform/compose.dev.yml --env-file /tmp/ci.env config -q
          docker compose -f platform/compose.dev.yml -f platform/compose.ca.yml --env-file /tmp/ci.env config -q

  ml-tests:
    name: ml-tests
    needs: escopo
    if: needs.escopo.outputs.rapido != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      - name: pytest (testes leves, sem rede)
        working-directory: ml
        run: |
          uv sync --frozen
          uv run --frozen pytest -m "not models"

  ml-models-tests:
    # na via rápida só a verificação dos notebooks; o pytest -m models é teste do pacote ml
    name: ml-models-tests
    needs: escopo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: ml/uv.lock
      - name: notebooks de modelo (células comuns idênticas, imports e requirements)
        working-directory: ml
        run: |
          uv sync --frozen --all-extras
          uv run --frozen --all-extras python notebooks/_ferramentas/verificar_comum.py
          uv run --frozen --all-extras python notebooks/_ferramentas/verificar_requirements.py
      - name: pytest -m models (grupo de dependências pesadas)
        if: needs.escopo.outputs.rapido != 'true'
        working-directory: ml
        run: |
          uv sync --frozen --all-extras
          set +e
          # --all-extras também no run: sem ele o uv re-sincroniza e remove o grupo models
          uv run --frozen --all-extras pytest -m models
          rc=$?
          set -e
          if [ "$rc" -eq 5 ]; then
            echo "::notice::Nenhum teste marcado como 'models' ainda (add-dengue-forecast-models)."
            exit 0
          fi
          exit "$rc"

  images:
    name: images (${{ matrix.name }})
    needs: escopo
    if: needs.escopo.outputs.rapido != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: ml, context: ml, file: ml/Dockerfile, target: runtime }
          - { name: ml-notebook, context: ml, file: ml/Dockerfile, target: notebook }
          - { name: mlflow, context: infra/mlflow, file: infra/mlflow/Dockerfile, target: "" }
          - { name: airflow, context: ., file: airflow/Dockerfile, target: "" }
          - { name: backend, context: backend, file: backend/Dockerfile, target: "" }
          - { name: frontend, context: frontend, file: frontend/Dockerfile, target: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build (sem publicar)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          build-args: |
            ATLAS_GIT_SHA=${{ github.sha }}
            ATLAS_IMAGE_TAG=ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  dags:
    # Via completa: a imagem do commit (cache do job images). Via rápida: a imagem :hml publicada, que é
    # válida porque nenhum insumo dela mudou; em ambas, DAGs, testes e notebooks montados do commit.
    name: dags
    needs: [escopo, images]
    if: >-
      ${{ !cancelled() && needs.escopo.result == 'success' && (needs.images.result == 'success'
      || (needs.images.result == 'skipped' && needs.escopo.outputs.rapido == 'true')) }}
    runs-on: ubuntu-latest
    env:
      RAPIDO: ${{ needs.escopo.outputs.rapido }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        if: env.RAPIDO != 'true'
      - name: imagem do Airflow (cache do job images)
        if: env.RAPIDO != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile
          load: true
          tags: atlas-epidemiologia-airflow:ci
          build-args: |
            ATLAS_GIT_SHA=${{ github.sha }}
            ATLAS_IMAGE_TAG=ci
          cache-from: type=gha,scope=airflow
      - name: imagem do Airflow publicada (via rápida)
        if: env.RAPIDO == 'true'
        run: |
          docker pull anselmomendes/atlas-epidemiologia-airflow:hml
          docker tag anselmomendes/atlas-epidemiologia-airflow:hml atlas-epidemiologia-airflow:ci
      - name: testes de DAG (DAGs, testes e notebooks do commit)
        # DAGs do Cosmos rodam `dbt ls` na leitura: profile com chave fictícia (não conecta) e sem cache (sem banco)
        run: |
          testar() {
            echo "::group::$1"
            docker run --rm --entrypoint python \
              -e DBT_BQ_KEYFILE=/tmp/chave-ficticia.json \
              -e AIRFLOW__COSMOS__ENABLE_CACHE_DBT_LS=False \
              -v "${PWD}/airflow/dags:/opt/airflow/dags" \
              -v "${PWD}/airflow/tests:/opt/atlas/tests:ro" \
              -v "${PWD}/ml/notebooks:/opt/atlas/notebooks:ro" \
              atlas-epidemiologia-airflow:ci "/opt/atlas/tests/$1"
            echo "::endgroup::"
          }
          testar test_dags.py                # integridade das DAGs
          testar test_forecast_modelo.py     # runs de base do ensemble (MLflow simulado)
          testar test_sinan_ingest.py        # plano de sync do SINAN (sem rede)
          testar test_forecast_export.py     # exportação das previsões (funções puras)
          testar test_etl_brasil.py          # decisões do fluxo etl_brasil (funções puras)
          testar test_ingestao_arquivo.py    # ingestão de arquivos do notebook (cliente simulado)

  platform-e2e:
    name: platform-e2e
    needs: [escopo, images]
    if: needs.escopo.outputs.rapido != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: imagem do Airflow (cache do job images)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: airflow/Dockerfile
          load: true
          tags: atlas-epidemiologia-airflow:local
          build-args: |
            ATLAS_GIT_SHA=${{ github.sha }}
            ATLAS_IMAGE_TAG=local
          cache-from: type=gha,scope=airflow
      - name: imagem do MLflow (cache do job images)
        uses: docker/build-push-action@v6
        with:
          context: infra/mlflow
          load: true
          tags: atlas-epidemiologia-mlflow:local
          build-args: |
            ATLAS_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=mlflow
      - name: compose → DAG de exemplo → MLflow
        env:
          E2E_NO_BUILD: "1"
          ATLAS_GIT_SHA: ${{ github.sha }}
        run: bash platform/ci/e2e.sh
      - name: logs dos serviços (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: e2e-logs/
          retention-days: 7

  frontend:
    name: frontend
    needs: escopo
    if: needs.escopo.outputs.rapido != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: navegador do Playwright
        run: npx playwright install --with-deps chromium
      - name: smoke de ponta a ponta (build de produção + backend mock)
        run: npm run test:e2e
      - name: relatório do Playwright (em falha)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/test-results/
          retention-days: 7

  backend:
    name: backend
    needs: escopo
    if: needs.escopo.outputs.rapido != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: ruff e pytest (sem BigQuery nem Redis)
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .
          uv run --frozen pytest

  secrets:
    # Credenciais não podem entrar no Git: nomes e conteúdos proibidos (todos os arquivos
    # rastreados) e gitleaks no histórico inteiro. Roda em todo push e PR, sem segredos.
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: arquivos e conteúdos de credencial
        run: bash platform/ci/check-secrets.sh --all
      - name: gitleaks (histórico completo)
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner -c .gitleaks.toml

  openspec:
    name: openspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: validação estrita de todas as mudanças
        run: npx --yes "@fission-ai/openspec@${OPENSPEC_VERSION}" validate --all --strict

  stack:
    # Stack de hml e prod (docker-compose.yml da raiz) e os arquivos de que ele depende: presença,
    # `docker stack config` para hml e prod e propriedades de segurança (platform/ci/check-stack.sh).
    # Roda em todo push e PR, inclusive nos que levam o stack para hml e main.
    name: stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PyYAML para o script
        run: python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml
      - name: validar o stack de hml e prod
        run: bash platform/ci/check-stack.sh
      - name: o serviço jupyter recusa cada violação (testes negativos)
        run: bash platform/ci/test-check-stack-jupyter.sh

  promocao:
    # Fluxo dev → hml → main: hml só recebe PR de dev e main só recebe PR de hml. Só roda em PR;
    # fora dele (push, tag, chamada das imagens) é pulado, e o ci-ok aceita o pulo só nesses casos.
    name: promocao
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: origem do PR
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          case "${BASE}" in
            hml) esperado=dev ;;
            main) esperado=hml ;;
            *) echo "::error::PR para ${BASE} fora do fluxo: só hml e main recebem promoção."; exit 1 ;;
          esac
          if [ "${HEAD}" != "${esperado}" ]; then
            echo "::error::A branch ${BASE} só recebe PR de ${esperado} (fluxo dev → hml → main); este PR vem de ${HEAD}."
            exit 1
          fi
          echo "PR ${HEAD} → ${BASE}: origem correta."

  ci-ok:
    # Check único exigido na proteção de hml e main. Passa só se TODOS os jobs passaram:
    # failure, cancelled ou skipped em qualquer job → falha (um job pulado não pode
    # liberar o merge, p.ex. dags/platform-e2e pulados porque images falhou). Exceções: o promocao
    # fora de PR e, só na via rápida, os jobs que ela dispensa.
    name: ci-ok
    if: always()
    needs: [escopo, lint, ml-tests, ml-models-tests, images, dags, platform-e2e, frontend, backend, secrets, openspec, stack, promocao]
    runs-on: ubuntu-latest
    steps:
      - name: resultado agregado
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENTO: ${{ github.event_name }}
          RAPIDO: ${{ needs.escopo.outputs.rapido }}
        run: |
          echo "via rápida: ${RAPIDO:-false}"
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # promocao só roda em PR: pulado fora de PR é o esperado; pulado dentro de PR falha.
          # Na via rápida, images, platform-e2e, frontend, backend e ml-tests pulados são o esperado.
          bad="$(echo "$NEEDS" | jq -r --arg ev "$EVENTO" --arg rapido "${RAPIDO:-false}" '
            ["images", "platform-e2e", "frontend", "backend", "ml-tests"] as $dispensados
            | [to_entries[]
              | select(.value.result != "success")
              | select((.key == "promocao" and .value.result == "skipped" and $ev != "pull_request") | not)
              | select(($rapido == "true" and .value.result == "skipped" and (.key as $k | $dispensados | index($k))) | not)
              | .key] | join(", ")')"
          if [ -n "$bad" ]; then
            echo "::error::Jobs sem sucesso: ${bad}"
            exit 1
          fi
