# Publica as imagens do ml: a de treino atlas-ml (alvo runtime de ml/Dockerfile) e a do Jupyter (alvo notebook,
# atlas-epidemiologia-ml-notebook). dev e hml por push, X.Y por tag, ou à mão.
name: ml

on:
  push:
    branches: [dev, hml]
    paths:
      - "ml/**"
      - ".github/workflows/ml.yml"
      - ".github/workflows/_image.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/_image.yml
    with:
      image: ml
      context: ml
      target: runtime
    secrets: inherit

  image-notebook:
    uses: ./.github/workflows/_image.yml
    with:
      image: ml-notebook
      context: ml
      target: notebook
      # CatBoost, PyTorch, PyMC e Chronos: as mesmas versões que o Airflow usa nos notebooks dos modelos
      build_args: |
        ATLAS_ML_EXTRAS=models
    secrets: inherit
