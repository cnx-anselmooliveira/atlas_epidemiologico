# Publica a imagem da API gold (backend/): dev e hml por push (só com mudança em backend/), X.Y por tag, ou à mão (workflow_dispatch).
name: backend

on:
  push:
    branches: [dev, hml]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
      - ".github/workflows/_image.yml"
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    uses: ./.github/workflows/_image.yml
    with:
      image: backend
      context: backend
    secrets: inherit
