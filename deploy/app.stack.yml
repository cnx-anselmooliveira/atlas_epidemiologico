# Stack da aplicação (Swarm/Portainer): site (Astro SSR) + API gold + Redis.
#   docker stack config -c deploy/app.stack.yml      # valida (precisa das variáveis abaixo)
#
# Segredos e ajustes só como VARIÁVEIS DA STACK no Portainer; este arquivo não tem valores:
#   GOOGLE_APPLICATION_CREDENTIALS_JSON  JSON da service account (somente leitura no BigQuery)
#   ADMIN_TOKEN                          reservado para a invalidação de cache (backend, tarefa 5.5)
#   FRONTEND_HOST / API_HOST             hosts públicos (padrão: temporários, ver abaixo)
#   BACKEND_TAG / FRONTEND_TAG           tag das imagens (padrão latest; o CI atualiza por webhook)
#   FRONTEND_PUBLIC_URL                  URL pública do site (canonical), ex.: https://dengue.contovisual.com.br
#
# Hosts temporários até o corte (mudança decouple-architecture-bigquery, grupo 9):
#   site next.dengue.contovisual.com.br · API api-next.dengue.contovisual.com.br
# O site chama a API pela rede interna (http://backend:8000); o navegador só fala com o site.
# O Redis não publica porta e só existe na rede interna.

# O nome da stack (atlas-app) é dado no Portainer.
services:
  frontend:
    image: anselmomendes/atlas-epidemiologia-frontend:${FRONTEND_TAG:-latest}
    environment:
      API_INTERNAL_URL: http://backend:8000
      PUBLIC_SITE_URL: ${FRONTEND_PUBLIC_URL:-https://next.dengue.contovisual.com.br}
      PAGE_CACHE_SECONDS: ${PAGE_CACHE_SECONDS:-300}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-8000}
    networks: [atlas_internal, network_public]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.atlas-frontend.rule=Host(`${FRONTEND_HOST:-next.dengue.contovisual.com.br}`)
        - traefik.http.routers.atlas-frontend.entrypoints=websecure
        - traefik.http.routers.atlas-frontend.tls.certresolver=letsencryptresolver
        - traefik.http.services.atlas-frontend.loadbalancer.server.port=4321

  backend:
    image: anselmomendes/atlas-epidemiologia-backend:${BACKEND_TAG:-latest}
    environment:
      GCP_PROJECT: ${GCP_PROJECT:-ppgcc-dengue-project}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${GOOGLE_APPLICATION_CREDENTIALS_JSON:?defina a chave da service account na stack}
      REDIS_URL: redis://redis:6379/0
      MAX_BYTES_BILLED: ${MAX_BYTES_BILLED:-1073741824}
    networks: [atlas_internal, network_public]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.atlas-api.rule=Host(`${API_HOST:-api-next.dengue.contovisual.com.br}`)
        - traefik.http.routers.atlas-api.entrypoints=websecure
        - traefik.http.routers.atlas-api.tls.certresolver=letsencryptresolver
        - traefik.http.services.atlas-api.loadbalancer.server.port=8000

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    networks: [atlas_internal]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

networks:
  atlas_internal:
    driver: overlay
  network_public:
    external: true
