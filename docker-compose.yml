# Stack do Atlas completo (Swarm/Portainer), o mesmo arquivo para hml e prod:
#   Postgres + MLflow + Airflow (init, api-server, scheduler, dag-processor, triggerer)
#   + API gold (backend) + site (frontend) + Redis.
#
# Criar no Portainer em Stacks › Add stack › Repository (branch hml → stack atlas-hml; main →
# atlas-prod), caminho docker-compose.yml. Os valores são as variáveis do stack, listadas e
# comentadas no .env.example da raiz; este arquivo só tem REFERÊNCIAS, nenhum valor de credencial.
# Passo a passo, secrets e rotação: deploy/README.md.
#
#   docker stack config -c docker-compose.yml    # valida (precisa das variáveis obrigatórias)
#
# Ordem de subida (o Swarm ignora depends_on): o Postgres cria os bancos no primeiro boot, o
# airflow-init (job de execução única) migra o banco e cria o admin, e os demais componentes do
# Airflow esperam a migração (airflow db check-migrations) antes de iniciar.
# Um nó: os volumes são locais e os serviços do Airflow ficam presos ao nó indicado.
#
# Recursos (VPS de hml: 4 CPUs, 8 GB, dividida com outros stacks; medido em 18/11/2026: ~5,7 GB
# em uso sem treino, ~2 GB deles de outros stacks). O treino roda no scheduler (LocalExecutor),
# que tem o maior limite; o MLflow usa 1 worker (2 workers ocupavam 2,2 GB). Ajuste depois de
# medir o treino completo (docs/referencias/resultados-forecast-br.md).

x-airflow-env: &airflow-env
  ATLAS_ENV: ${ATLAS_ENV:?hml ou prod}
  # DAGs e notebook do pipeline vêm do clone do serviço git-sync (volume airflow_dags): o merge na
  # branch do ambiente chega ao Airflow sem nova imagem. A imagem guarda só uma cópia de reserva.
  AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/git/current/airflow/dags
  AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "60"
  ATLAS_DAGS_LINK: /opt/airflow/git/current
  ATLAS_NOTEBOOKS_DIR: /opt/airflow/git/current/ml/notebooks
  # Dados separados por ambiente (add-env-data-isolation): o landing e os datasets bronze, silver e
  # gold saem do ATLAS_ENV no código; a exportação das previsões escreve em forecast_<ambiente>
  ATLAS_FORECAST_DATASET: forecast_${ATLAS_ENV:?}
  # FAB (login e senha); configuração não exposta na API (airflow/config/vps.env)
  AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
  AIRFLOW__API__EXPOSE_CONFIG: "False"
  AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: "False"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD:?}@postgres:5432/airflow
  AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET:?}
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?}
  AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
  AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:?}
  AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
  # Tarefas de ML: o MLflow tem autenticação (basic-auth)
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_TRACKING_USERNAME: ${MLFLOW_ADMIN_USERNAME:?}
  MLFLOW_TRACKING_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:?}
  GCP_PROJECT: ${GCP_PROJECT:-ppgcc-dengue-project}
  # Chave da service account de treino: Docker secret montado como arquivo, nunca o conteúdo
  # threads por tarefa de treino (VPS de 4 CPUs; o pool atlas_treino limita os pesados)
  ATLAS_THREADS: ${ATLAS_THREADS:-2}
  # Teto de tarefas simultâneas do Airflow inteiro: o LocalExecutor roda tudo dentro do scheduler,
  # e tarefas demais o deixam sem heartbeat (o health check falha e o Swarm o reinicia)
  AIRFLOW__CORE__PARALLELISM: ${AIRFLOW_PARALLELISM:-6}
  GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/training_sa.json
  DBT_BQ_KEYFILE: /run/secrets/training_sa.json
  DBT_PARTIAL_PARSE: "false"
  AIRFLOW_CONN_GOOGLE_CLOUD_DEFAULT: '{"conn_type": "google_cloud_platform", "extra": {"key_path": "/run/secrets/training_sa.json", "project": "${GCP_PROJECT:-ppgcc-dengue-project}"}}'
  # Cache do Cosmos e documentação do dbt separados por ambiente (hml e prod nunca dividem prefixo)
  AIRFLOW__COSMOS__REMOTE_CACHE_DIR: gs://${ATLAS_BUCKET:-ppgcc-bucket}/cosmos_cache/${ATLAS_ENV}
  AIRFLOW__COSMOS__REMOTE_CACHE_DIR_CONN_ID: google_cloud_default
  AIRFLOW__COSMOS__DBT_DOCS_PROJECTS: '{"atlas": {"dir": "gs://${ATLAS_BUCKET:-ppgcc-bucket}/dbt_docs/${ATLAS_ENV}", "conn_id": "google_cloud_default", "index": "index.html", "name": "dbt Docs (Atlas)"}}'

x-airflow: &airflow
  image: ${IMAGE_REPO_PREFIX:-anselmomendes/atlas-epidemiologia}-airflow:${IMAGE_TAG:?tag das imagens (hml ou X.Y), nunca latest}
  user: "50000:0"
  environment: *airflow-env
  # montado com extensão .json: o provider do Google no Airflow recusa key_path sem ela
  # ("Unrecognised extension for key file", visto no hml)
  secrets:
    - source: training_sa
      target: training_sa.json
  volumes:
    - airflow_logs:/opt/airflow/logs
    - airflow_shared:/opt/airflow/shared
    - hf_cache:/opt/airflow/hf-cache
    - airflow_dags:/opt/airflow/git:ro   # clone do git-sync, somente leitura
  networks: [atlas_internal]

x-airflow-deploy: &airflow-deploy
  replicas: 1
  placement:
    constraints: ["node.role == ${PLACEMENT_ROLE:-manager}"]
  restart_policy:
    condition: on-failure
    delay: 10s
  # um scheduler por vez: nunca dois ao mesmo tempo durante a atualização
  update_config:
    order: stop-first
    failure_action: rollback

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:?}
      AIRFLOW_DB_PASSWORD: ${AIRFLOW_DB_PASSWORD:?}
      AIRFLOW_DATABASES: airflow
    configs:
      - source: pg_init
        target: /docker-entrypoint-initdb.d/10-init-databases.sh
        mode: 0555
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [atlas_internal]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          memory: 128M
      replicas: 1
      placement:
        constraints: ["node.role == ${PLACEMENT_ROLE:-manager}"]
      restart_policy:
        condition: on-failure
      update_config:
        order: stop-first

  mlflow:
    image: ${IMAGE_REPO_PREFIX:-anselmomendes/atlas-epidemiologia}-mlflow:${IMAGE_TAG:?}
    environment:
      MLFLOW_BACKEND_STORE_URI: postgresql://mlflow:${MLFLOW_DB_PASSWORD:?}@postgres:5432/mlflow
      MLFLOW_ARTIFACTS_BUCKET: ${ATLAS_BUCKET:-ppgcc-bucket}
      # gs://<bucket>/mlflow/<hml|prod>
      MLFLOW_INSTALLATION: ${ATLAS_ENV:?}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/mlflow_sa
      MLFLOW_AUTH: "true"
      MLFLOW_AUTH_DATABASE_URI: postgresql://mlflow:${MLFLOW_DB_PASSWORD:?}@postgres:5432/mlflow_auth
      MLFLOW_ADMIN_USERNAME: ${MLFLOW_ADMIN_USERNAME:?}
      MLFLOW_ADMIN_PASSWORD: ${MLFLOW_ADMIN_PASSWORD:?}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SECRET_KEY:?}
      MLFLOW_ALLOWED_HOSTS: ${MLFLOW_HOST:-mlflow.invalid},mlflow,mlflow:5000
      MLFLOW_WORKERS: ${MLFLOW_WORKERS:-1}
    # Primeira subida: migra os bancos mlflow e mlflow_auth, o que passa da janela da imagem
    # (40 s + 3 × 30 s) e fazia o Swarm matar o container no meio. Mesma sonda, janela maior.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 240s
    secrets: [mlflow_sa]
    networks: [atlas_internal, network_public]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      update_config:
        order: start-first
        failure_action: rollback
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.atlas-${ATLAS_ENV}-mlflow.rule=Host(`${MLFLOW_HOST:-mlflow.invalid}`)
        - traefik.http.routers.atlas-${ATLAS_ENV}-mlflow.entrypoints=websecure
        - traefik.http.routers.atlas-${ATLAS_ENV}-mlflow.tls.certresolver=letsencryptresolver
        - traefik.http.routers.atlas-${ATLAS_ENV}-mlflow.middlewares=atlas-${ATLAS_ENV}-admin
        - traefik.http.middlewares.atlas-${ATLAS_ENV}-admin.ipallowlist.sourcerange=${ADMIN_ALLOWED_CIDRS:-127.0.0.1/32}
        - traefik.http.services.atlas-${ATLAS_ENV}-mlflow.loadbalancer.server.port=5000

  # Clona a branch do ambiente (hml ou main) num volume que o Airflow lê somente leitura. O link `current`
  # é trocado de forma atômica a cada sincronização. O repositório é público: HTTPS, sem credencial (se
  # virar privado, um secret do stack com a credencial; ver deploy/README.md). GITSYNC_MAX_FAILURES=-1:
  # com o GitHub fora do ar o serviço segue tentando e o Airflow fica com a última versão sincronizada.
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.4.0
    user: "0:0"
    cap_drop: [ALL]
    environment:
      GITSYNC_REPO: ${ATLAS_DAGS_REPO:-https://github.com/cnx-anselmooliveira/atlas_epidemiologico.git}
      GITSYNC_REF: ${ATLAS_DAGS_BRANCH:?branch do ambiente (hml ou main)}
      GITSYNC_PERIOD: ${ATLAS_DAGS_SYNC_PERIOD:-60s}
      GITSYNC_DEPTH: "1"
      GITSYNC_ROOT: /git
      GITSYNC_LINK: current
      GITSYNC_MAX_FAILURES: "-1"
    volumes:
      - airflow_dags:/git
    networks: [atlas_internal]
    deploy:
      <<: *airflow-deploy
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # Job de execução única: migra o banco e garante o admin (idempotente, roda a cada deploy)
  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command: /opt/atlas/init.sh
    networks: [atlas_internal]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
      mode: replicated-job
      replicas: 1
      placement:
        constraints: ["node.role == ${PLACEMENT_ROLE:-manager}"]
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 20

  airflow-api-server:
    <<: *airflow
    command: ["bash", "-c", "/opt/atlas/aguardar-clone.sh && airflow db check-migrations --migration-wait-timeout 900 && exec airflow api-server"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks: [atlas_internal, network_public]
    deploy:
      <<: *airflow-deploy
      resources:
        limits:
          cpus: "1"
          memory: 768M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.atlas-${ATLAS_ENV}-airflow.rule=Host(`${AIRFLOW_HOST:-airflow.invalid}`)
        - traefik.http.routers.atlas-${ATLAS_ENV}-airflow.entrypoints=websecure
        - traefik.http.routers.atlas-${ATLAS_ENV}-airflow.tls.certresolver=letsencryptresolver
        - traefik.http.routers.atlas-${ATLAS_ENV}-airflow.middlewares=atlas-${ATLAS_ENV}-admin
        - traefik.http.middlewares.atlas-${ATLAS_ENV}-admin.ipallowlist.sourcerange=${ADMIN_ALLOWED_CIDRS:-127.0.0.1/32}
        - traefik.http.services.atlas-${ATLAS_ENV}-airflow.loadbalancer.server.port=8080

  airflow-scheduler:
    <<: *airflow
    command: ["bash", "-c", "/opt/atlas/aguardar-clone.sh && airflow db check-migrations --migration-wait-timeout 900 && exec airflow scheduler"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8974/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s
    deploy:
      <<: *airflow-deploy
      resources:
        limits:
          cpus: "3"
          memory: 3584M

  airflow-dag-processor:
    <<: *airflow
    command: ["bash", "-c", "/opt/atlas/aguardar-clone.sh && airflow db check-migrations --migration-wait-timeout 900 && exec airflow dag-processor"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s
    deploy:
      <<: *airflow-deploy
      resources:
        limits:
          cpus: "1"
          memory: 1G

  airflow-triggerer:
    <<: *airflow
    command: ["bash", "-c", "/opt/atlas/aguardar-clone.sh && airflow db check-migrations --migration-wait-timeout 900 && exec airflow triggerer"]
    healthcheck:
      test: ["CMD-SHELL", 'airflow jobs check --job-type TriggererJob --hostname "$${HOSTNAME}"']
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 90s
    deploy:
      <<: *airflow-deploy
      resources:
        limits:
          cpus: "0.5"
          memory: 768M

  # Jupyter de exploração: a imagem ml-notebook (mesmas versões do Airflow), em host próprio com senha e TLS.
  # É um caderno ISOLADO: sem secrets, sem credenciais de nenhum serviço e fora da rede atlas_internal (não
  # alcança MLflow, Airflow, banco nem Redis). Os dados são os que a pessoa subir. A senha chega só como hash
  # (JUPYTER_PASSWORD_HASH). Sem lista de IPs: o proxy limita as tentativas por origem. O check-stack.sh
  # garante o isolamento. Receita: deploy/README.md. JUPYTER_REPLICAS=0 desliga sem tocar nos outros.
  jupyter:
    image: ${IMAGE_REPO_PREFIX:-anselmomendes/atlas-epidemiologia}-ml-notebook:${IMAGE_TAG:?tag das imagens (hml ou X.Y), nunca latest}
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    environment:
      ATLAS_ENV: ${ATLAS_ENV:?hml ou prod}
      # só o HASH da senha (argon2), nunca a senha; o servidor não sobe sem ele. O valor vai cru, sem aspas
      JUPYTER_PASSWORD_HASH: ${JUPYTER_PASSWORD_HASH:?hash argon2 da senha do Jupyter}
      ATLAS_THREADS: ${ATLAS_THREADS:-2}
      HF_HOME: /home/atlas/hf-cache
    volumes:
      - jupyter_work:/home/atlas/work
      - jupyter_hf_cache:/home/atlas/hf-cache
      - type: tmpfs
        target: /tmp
    networks: [network_public]
    deploy:
      <<: *airflow-deploy
      replicas: ${JUPYTER_REPLICAS:-1}
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.atlas-${ATLAS_ENV}-jupyter.rule=Host(`${JUPYTER_HOST:-jupyter.invalid}`)
        - traefik.http.routers.atlas-${ATLAS_ENV}-jupyter.entrypoints=websecure
        - traefik.http.routers.atlas-${ATLAS_ENV}-jupyter.tls.certresolver=letsencryptresolver
        - traefik.http.routers.atlas-${ATLAS_ENV}-jupyter.middlewares=atlas-${ATLAS_ENV}-jupyter-limite
        # sem lista de IPs: limita as requisições por origem (freia tentativas de senha em massa, resposta 429)
        - traefik.http.middlewares.atlas-${ATLAS_ENV}-jupyter-limite.ratelimit.average=10
        - traefik.http.middlewares.atlas-${ATLAS_ENV}-jupyter-limite.ratelimit.period=1s
        - traefik.http.middlewares.atlas-${ATLAS_ENV}-jupyter-limite.ratelimit.burst=20
        - traefik.http.services.atlas-${ATLAS_ENV}-jupyter.loadbalancer.server.port=8888

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [atlas_internal]
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 384M
      replicas: 1
      restart_policy:
        condition: on-failure

  backend:
    image: ${IMAGE_REPO_PREFIX:-anselmomendes/atlas-epidemiologia}-backend:${IMAGE_TAG:?}
    environment:
      GCP_PROJECT: ${GCP_PROJECT:-ppgcc-dengue-project}
      # conta de LEITURA própria (BigQuery gold e forecast + prefixo forecast/ do bucket)
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/backend_sa
      REDIS_URL: redis://redis:6379/0
      MAX_BYTES_BILLED: ${MAX_BYTES_BILLED:-1073741824}
      # o site lê a gold e as previsões do próprio ambiente (gold_hml, forecast_hml em hml)
      BQ_DATASET_GOLD: gold_${ATLAS_ENV:?}
      BQ_DATASET_FORECAST: forecast_${ATLAS_ENV:?}
      FORECAST_BUCKET: ${ATLAS_BUCKET:-ppgcc-bucket}
      FORECAST_PREFIX: ${FORECAST_PREFIX:-forecast/}
    secrets: [backend_sa]
    networks: [atlas_internal, network_public]
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.atlas-${ATLAS_ENV}-api.rule=Host(`${API_HOST:?}`)
        - traefik.http.routers.atlas-${ATLAS_ENV}-api.entrypoints=websecure
        - traefik.http.routers.atlas-${ATLAS_ENV}-api.tls.certresolver=letsencryptresolver
        - traefik.http.services.atlas-${ATLAS_ENV}-api.loadbalancer.server.port=8000

  frontend:
    image: ${IMAGE_REPO_PREFIX:-anselmomendes/atlas-epidemiologia}-frontend:${IMAGE_TAG:?}
    environment:
      API_INTERNAL_URL: http://backend:8000
      PUBLIC_SITE_URL: ${FRONTEND_PUBLIC_URL:?}
      PAGE_CACHE_SECONDS: ${PAGE_CACHE_SECONDS:-300}
      BACKEND_TIMEOUT_MS: ${BACKEND_TIMEOUT_MS:-8000}
    networks: [atlas_internal, network_public]
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
      replicas: 1
      restart_policy:
        condition: on-failure
      update_config:
        order: start-first
        failure_action: rollback
      rollback_config:
        order: start-first
      labels:
        - traefik.enable=true
        - traefik.docker.network=network_public
        - traefik.http.routers.atlas-${ATLAS_ENV}-frontend.rule=Host(`${FRONTEND_HOST:?}`)
        - traefik.http.routers.atlas-${ATLAS_ENV}-frontend.entrypoints=websecure
        - traefik.http.routers.atlas-${ATLAS_ENV}-frontend.tls.certresolver=letsencryptresolver
        - traefik.http.services.atlas-${ATLAS_ENV}-frontend.loadbalancer.server.port=4321

# Chaves das service accounts: Docker secrets criados antes, no Portainer (Secrets › Add secret),
# um por ambiente. O nome inclui o ambiente porque os secrets são do cluster inteiro.
secrets:
  training_sa:
    name: atlas_${ATLAS_ENV}_training_sa
    external: true
  mlflow_sa:
    name: atlas_${ATLAS_ENV}_mlflow_sa
    external: true
  backend_sa:
    name: atlas_${ATLAS_ENV}_backend_sa
    external: true

# Script de bancos do Postgres (primeiro boot, volume vazio). O nome carrega a versão: ao mudar o
# script, aumente o sufixo, porque um Docker config não pode ser alterado.
configs:
  pg_init:
    name: atlas_${ATLAS_ENV}_pg_init_v1
    file: ./platform/postgres/init-databases.sh

volumes:
  pgdata:
  airflow_logs:
  airflow_shared:
  airflow_dags:
  hf_cache:
  jupyter_work:
  jupyter_hf_cache:

networks:
  atlas_internal:
    driver: overlay
  network_public:
    external: true
